name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: node src/cli.mjs examples/tiny.json
      - run: node src/cli.mjs examples/fairness-tradeoff.json --policy sjf
      - name: Regenerate and schedule a fixed-seed workload
        run: |
          node src/generate.mjs examples/generator/high-load.json > "$RUNNER_TEMP/high-load.json"
          cmp examples/generated/high-load.json "$RUNNER_TEMP/high-load.json"
          node src/cli.mjs "$RUNNER_TEMP/high-load.json" --policy sjf
      - name: Reproduce raw batch results and independently recompute summaries
        run: |
          node src/batch.mjs examples/experiments/baselines.json > "$RUNNER_TEMP/baselines.raw.json"
          cmp examples/experiments/baselines.raw.json "$RUNNER_TEMP/baselines.raw.json"
          node src/summarize.mjs "$RUNNER_TEMP/baselines.raw.json" > "$RUNNER_TEMP/baselines.summary.json"
          cmp examples/experiments/baselines.summary.json "$RUNNER_TEMP/baselines.summary.json"
      - name: Reproduce all policies and the waiting-weighted tradeoffs
        run: |
          node src/cli.mjs examples/fairness-tradeoff.json --policy waiting-weighted
          node src/cli.mjs examples/waiting-weighted-regression.json --policy waiting-weighted
          node src/batch.mjs examples/experiments/policies.json > "$RUNNER_TEMP/policies.raw.json"
          cmp examples/experiments/policies.raw.json "$RUNNER_TEMP/policies.raw.json"
          node src/summarize.mjs "$RUNNER_TEMP/policies.raw.json" > "$RUNNER_TEMP/policies.summary.json"
          cmp examples/experiments/policies.summary.json "$RUNNER_TEMP/policies.summary.json"
      - name: Validate source-only delivery without installing packages
        shell: bash
        run: |
          set -euo pipefail
          delivery=$(mktemp -d "$RUNNER_TEMP/scheduler-delivery.XXXXXX")
          mkdir "$delivery/source" "$delivery/home" "$delivery/cache"
          touch "$delivery/user.npmrc" "$delivery/global.npmrc"
          git archive --format=tar HEAD | tar -xf - -C "$delivery/source"
          cd "$delivery/source"
          test ! -e .git
          test ! -e node_modules
          offline_npm() {
            env -i PATH="$PATH" HOME="$delivery/home" \
              npm_config_offline=true npm_config_update_notifier=false \
              npm_config_cache="$delivery/cache" npm_config_userconfig="$delivery/user.npmrc" \
              npm_config_globalconfig="$delivery/global.npmrc" npm "$@"
          }
          offline_npm test
          offline_npm run demo
          offline_npm run reproduce
          test ! -e node_modules
